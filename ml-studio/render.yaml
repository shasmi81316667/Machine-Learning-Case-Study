services:
  - type: web
    name: simple-ml-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ml.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
